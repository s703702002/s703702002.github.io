<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Bridge 探測器</h1>
    <button onclick="detectBridges()" style="padding: 15px; font-size: 16px;">點我開始掃描</button>
    <pre id="result"></pre>

    <script>
        function detectBridges() {
            let output = {};

            // 1. 探測 iOS (WKWebView)
            if (window.webkit && window.webkit.messageHandlers) {
                output.iOS_Bridges = Object.keys(window.webkit.messageHandlers);
            } else {
                output.iOS_Bridges = "未偵測到 webkit 物件";
            }

            // 2. 探測可能的 Android 或自訂全域變數
            // 尋找 window 底下，不是標準瀏覽器 API 的自訂物件
            let customGlobals = [];
            for (let prop in window) {
                try {
                    // 過濾掉常見的網頁標準屬性，只留下看起來像 APP 注入的變數
                    if (prop !== 'webkit' && prop !== 'document' && prop !== 'location' && 
                        prop !== 'window' && prop.length > 2) {
                        
                        // 很多 APP 注入的物件在 typeof 判斷時會是 object 或 function
                        if (typeof window[prop] === 'object' || typeof window[prop] === 'function') {
                            // 這裡只簡單列出名稱，避免遞迴層級太深當機
                            customGlobals.push(prop); 
                        }
                    }
                } catch (e) {
                    // 跨域或安全限制導致無法讀取的屬性就跳過
                }
            }
            output.possible_Globals = customGlobals;

            // 顯示結果
            document.getElementById('result').innerHTML = JSON.stringify(output, null, 2);
        }
    </script>
</body>
</html>
